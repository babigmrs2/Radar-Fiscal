<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Fiscal · Bárbara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f5;
    --card:#ffffff;
    --borda:#e2e8e5;
    --verde:#0e3d26;
    --verde-suave:#e7efe9;
    --ouro:#c29337;
    --ouro-suave:#f6ecd9;
    --texto:#16211b;
    --texto-sec:#5b6b62;
    --alto:#c0392b;
    --alto-bg:#fbe9e7;
    --medio:#b7791f;
    --medio-bg:#fdf3df;
    --baixo:#3b5b74;
    --baixo-bg:#e8eef3;
    --sans:'Inter', -apple-system, sans-serif;
    --mono:'JetBrains Mono', monospace;
    --raio:8px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--texto);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .shell{max-width:1180px; margin:0 auto; padding:0 24px 60px;}

  /* ===== Top bar ===== */
  header.topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding:18px 0;
    border-bottom:1px solid var(--borda);
    margin-bottom:24px;
  }
  .marca{
    display:flex; align-items:center; gap:10px;
  }
  .marca-icone{
    width:34px; height:34px; border-radius:7px;
    background:var(--verde);
    display:flex; align-items:center; justify-content:center;
    color:var(--ouro-suave); font-family:var(--mono); font-weight:600; font-size:.85rem;
  }
  .marca-texto{font-weight:600; font-size:1rem; color:var(--texto);}
  .marca-texto .separador{color:var(--texto-sec); font-weight:400; margin:0 4px;}
  .marca-texto .nome{color:var(--verde);}

  .saudacao{
    font-size:1.15rem;
    font-weight:600;
    color:var(--texto);
    margin:16px 0 22px;
  }
  .saudacao .nome{color:var(--verde);}

  .status-cluster{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .status-bloco{display:flex; flex-direction:column; gap:2px;}
  .status-rotulo{font-size:.68rem; color:var(--texto-sec); letter-spacing:.02em;}
  .status-valor{font-family:var(--mono); font-size:.95rem; color:var(--texto); font-weight:500;}
  .status-valor.relogio{font-size:1.15rem; color:var(--verde); font-weight:600;}
  .sync-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#3f9c62; margin-right:6px;
  }

  /* ===== Tabs ===== */
  nav.abas{margin-bottom:22px;}
  .abas-lista{display:flex; gap:6px; flex-wrap:wrap;}
  .aba{
    background:var(--card);
    border:1px solid var(--borda);
    color:var(--texto-sec);
    font-family:var(--sans);
    font-size:.85rem;
    font-weight:500;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    transition:all .15s;
  }
  .aba:hover{border-color:var(--verde); color:var(--verde);}
  .aba[aria-selected="true"]{
    background:var(--verde);
    border-color:var(--verde);
    color:#fff;
  }

  /* ===== Grid principal ===== */
  .grid{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:860px){
    .grid{grid-template-columns:1fr;}
  }

  .painel{
    background:var(--card);
    border:1px solid var(--borda);
    border-radius:var(--raio);
    padding:20px;
  }
  .painel-titulo{
    font-size:.95rem; font-weight:600; color:var(--texto); margin:0 0 3px;
  }
  .painel-legenda{
    font-size:.78rem; color:var(--texto-sec); margin:0 0 18px;
  }

  /* Sidebar: placar */
  .sidebar{position:sticky; top:24px;}
  .placar-item + .placar-item{margin-top:16px; padding-top:16px; border-top:1px solid var(--borda);}
  .placar-cabecalho{display:flex; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .placar-nome{font-size:.82rem; font-weight:600; color:var(--texto);}
  .placar-pct{font-family:var(--mono); font-size:.8rem; color:var(--ouro); font-weight:600;}
  .placar-trilho{height:6px; background:var(--verde-suave); border-radius:4px; overflow:hidden;}
  .placar-preenchido{height:100%; background:var(--verde); border-radius:4px;}
  .placar-fase{font-size:.74rem; color:var(--texto-sec); margin:6px 0 0;}

  /* Coluna principal */
  .filtros-row{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .filtro-rotulo{font-size:.72rem; color:var(--texto-sec); font-weight:600; letter-spacing:.02em;}
  .chip{
    font-family:var(--sans); font-size:.78rem; font-weight:500;
    border:1px solid var(--borda);
    background:#fff;
    padding:6px 13px;
    border-radius:20px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:all .15s;
    margin-right:6px;
  }
  .chip .ponto{width:7px; height:7px; border-radius:50%;}
  .chip.impacto-alto .ponto{background:var(--alto);}
  .chip.impacto-medio .ponto{background:var(--medio);}
  .chip.impacto-baixo .ponto{background:var(--baixo);}
  .chip:hover{border-color:#c7d1cb;}
  .chip[aria-pressed="true"]{background:var(--verde-suave); border-color:var(--verde);}

  #contador-resultados{font-size:.78rem; color:var(--texto-sec); margin-bottom:12px;}

  .feed{display:flex; flex-direction:column; gap:12px;}
  .noticia{
    background:var(--card);
    border:1px solid var(--borda);
    border-radius:var(--raio);
    padding:16px 18px;
  }
  .noticia-topo{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .badge{
    font-family:var(--mono); font-size:.68rem; font-weight:600;
    padding:3px 9px; border-radius:5px;
  }
  .badge.impacto-alto{background:var(--alto-bg); color:var(--alto);}
  .badge.impacto-medio{background:var(--medio-bg); color:var(--medio);}
  .badge.impacto-baixo{background:var(--baixo-bg); color:var(--baixo);}
  .tag-esfera{
    font-size:.72rem; color:var(--verde); background:var(--verde-suave);
    padding:3px 9px; border-radius:5px; font-weight:500;
  }
  .noticia-fonte{font-size:.74rem; color:var(--texto-sec); margin-left:auto;}
  .noticia-titulo{font-size:.98rem; font-weight:600; color:var(--texto); margin:0 0 6px; line-height:1.4;}
  .noticia-resumo{font-size:.86rem; color:var(--texto-sec); margin:0 0 10px;}
  .noticia-link{
    font-size:.8rem; font-weight:500; color:var(--verde);
    text-decoration:none; border-bottom:1px solid var(--verde-suave);
  }
  .noticia-link:hover{border-color:var(--verde);}

  .vazio{
    padding:36px 0; text-align:center; color:var(--texto-sec); font-size:.88rem;
    border:1px dashed var(--borda); border-radius:var(--raio); background:#fff;
  }

  footer{
    margin-top:36px; padding-top:16px; border-top:1px solid var(--borda);
    font-size:.72rem; color:var(--texto-sec); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
</style>
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="marca">
      <div class="marca-icone">RF</div>
      <div class="marca-texto">Radar Fiscal <span class="separador">·</span><span class="nome">Bárbara</span></div>
    </div>
    <div class="status-cluster">
      <div class="status-bloco">
        <span class="status-rotulo">HORÁRIO DE BRASÍLIA</span>
        <span class="status-valor relogio" id="relogio">--:--:--</span>
      </div>
      <div class="status-bloco">
        <span class="status-rotulo">DATA</span>
        <span class="status-valor" id="data-hoje">—</span>
      </div>
      <div class="status-bloco">
        <span class="status-rotulo">SINCRONIZAÇÃO</span>
        <span class="status-valor"><span class="sync-dot"></span><span id="sync-texto">agora mesmo</span></span>
      </div>
    </div>
  </header>

  <p class="saudacao" id="saudacao">Bom dia, <span class="nome">Bárbara</span>.</p>

  <nav class="abas" aria-label="Visões do radar">
    <div class="abas-lista" id="lista-abas" role="tablist"></div>
  </nav>

  <div class="grid">

    <aside class="painel sidebar">
      <h2 class="painel-titulo">Placar da Reforma</h2>
      <p class="painel-legenda">IBS, CBS e Imposto Seletivo</p>
      <div id="placar"></div>
    </aside>

    <main>
      <div class="painel" style="margin-bottom:16px;">
        <div class="filtros-row">
          <span class="filtro-rotulo">IMPACTO</span>
          <div id="filtro-impacto"></div>
        </div>
      </div>

      <p id="contador-resultados"></p>
      <div class="feed" id="feed"></div>
    </main>

  </div>

  <footer>
    <span>Radar Fiscal Diário</span>
    <span id="fonte-dados-indicador">Carregando fonte de dados…</span>
  </footer>

</div>

<script>
(function(){

  /* ---------- Fallback local (usado se noticias.json não for encontrado) ---------- */
  const FALLBACK_NOTICIAS = [
    {
      id: 1,
      titulo: "Comitê Gestor do IBS publica agenda de regulamentação para insumos agropecuários",
      resumo: "Calendário prevê consulta pública sobre a lista de insumos com redução de alíquota, incluindo fertilizantes e defensivos, antes da vigência em 2027.",
      esfera: "reforma",
      uf: null,
      setor: "fertilizantes",
      impacto: "alto",
      fonte: "Comitê Gestor do IBS",
      link: "#"
    },
    {
      id: 2,
      titulo: "Sefaz-SP amplia isenção de ICMS para operações interestaduais com adubos e corretivos de solo",
      resumo: "Benefício é prorrogado até o fim de 2027, com exigência de registro atualizado no Sped Fiscal para as indústrias paulistas.",
      esfera: "estadual",
      uf: "SP",
      setor: "agronegocio",
      impacto: "medio",
      fonte: "Sefaz-SP",
      link: "#"
    },
    {
      id: 3,
      titulo: "Sefaz-MT concede diferimento de ICMS na importação de fertilizantes para a safra 2026",
      resumo: "Regime especial adia o recolhimento do imposto para o momento da saída do produto, aliviando o caixa das tradings durante o pico de plantio.",
      esfera: "estadual",
      uf: "MT",
      setor: "fertilizantes",
      impacto: "alto",
      fonte: "Sefaz-MT",
      link: "#"
    },
    {
      id: 4,
      titulo: "Economia-GO revisa tributação de defensivos agrícolas em operações de armazenagem",
      resumo: "Nova instrução normativa detalha a base de cálculo do ICMS para operações de armazéns gerais que prestam serviço ao agronegócio goiano.",
      esfera: "estadual",
      uf: "GO",
      setor: "agronegocio",
      impacto: "medio",
      fonte: "Economia-GO (Sefaz-GO)",
      link: "#"
    },
    {
      id: 5,
      titulo: "Imposto Seletivo não incidirá sobre defensivos e fertilizantes, confirma texto aprovado",
      resumo: "Relatório final mantém a exclusão do setor da lista de produtos sujeitos ao chamado 'imposto do pecado', atendendo pleito do agronegócio.",
      esfera: "reforma",
      uf: null,
      setor: "agronegocio",
      impacto: "alto",
      fonte: "Congresso Nacional",
      link: "#"
    },
    {
      id: 6,
      titulo: "CBS: Receita Federal libera novo layout de nota fiscal para o período de testes",
      resumo: "Ambiente de homologação já aceita o novo campo de CBS destacado, com testes obrigatórios para empresas do regime não cumulativo.",
      esfera: "federal",
      uf: null,
      setor: "fertilizantes",
      impacto: "baixo",
      fonte: "Receita Federal do Brasil",
      link: "#"
    }
  ];

  const ABAS = [
    { id: "geral", rotulo: "Visão Geral" },
    { id: "fertilizantes", rotulo: "Fertilizantes & Insumos" },
    { id: "agronegocio", rotulo: "Agronegócio Geral" },
    { id: "reforma", rotulo: "Reforma Tributária" }
  ];

  const PLACAR = [
    { nome: "IBS", pct: 68, fase: "Regulamentação infralegal · Comitê Gestor formado, consulta pública em curso." },
    { nome: "CBS", pct: 74, fase: "Testes de sistema · layout de nota fiscal em homologação." },
    { nome: "Imposto Seletivo", pct: 52, fase: "Definição da lista de produtos · agro e fertilizantes fora da incidência." }
  ];

  const IMPACTO_ROTULO = { alto: "Alto", medio: "Médio", baixo: "Baixo" };
  const ESFERA_ROTULO = { reforma: "Reforma Tributária", federal: "Federal", estadual: "Estadual", municipal: "Municipal" };

  let filtroAbaAtiva = "geral";
  let impactosAtivos = new Set();
  let noticiasCarregadas = [];

  /* ---------- Relógio (Horário de Brasília) ---------- */
  const NOME_USUARIA = "Bárbara";

  function horaAtualBrasilia(){
    const agora = new Date();
    const horaTexto = agora.toLocaleString("en-US", { timeZone:"America/Sao_Paulo", hour:"2-digit", hour12:false });
    return parseInt(horaTexto, 10) % 24;
  }

  function saudacaoPorHorario(hora){
    if (hora >= 5 && hora < 12) return "Bom dia";
    if (hora >= 12 && hora < 18) return "Boa tarde";
    return "Boa noite";
  }

  function atualizarSaudacao(){
    const hora = horaAtualBrasilia();
    document.getElementById("saudacao").innerHTML =
      saudacaoPorHorario(hora) + ', <span class="nome">' + NOME_USUARIA + '</span>.';
  }

  function atualizarRelogio(){
    const agora = new Date();
    const opcoesHora = { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit", second:"2-digit" };
    const opcoesData = { timeZone:"America/Sao_Paulo", weekday:"long", day:"2-digit", month:"long", year:"numeric" };
    document.getElementById("relogio").textContent = agora.toLocaleTimeString("pt-BR", opcoesHora);
    document.getElementById("data-hoje").textContent = agora.toLocaleDateString("pt-BR", opcoesData);
    atualizarSaudacao();
  }
  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);

  let segundosDesdeSync = 0;
  setInterval(function(){
    segundosDesdeSync++;
    const el = document.getElementById("sync-texto");
    el.textContent = segundosDesdeSync < 60 ? "agora mesmo" : "há " + Math.floor(segundosDesdeSync/60) + " min";
  }, 1000);

  /* ---------- Abas ---------- */
  const listaAbas = document.getElementById("lista-abas");
  ABAS.forEach(function(aba){
    const btn = document.createElement("button");
    btn.className = "aba";
    btn.textContent = aba.rotulo;
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", aba.id === filtroAbaAtiva ? "true":"false");
    btn.addEventListener("click", function(){
      filtroAbaAtiva = aba.id;
      document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-selected","false"));
      btn.setAttribute("aria-selected","true");
      renderFeed();
    });
    listaAbas.appendChild(btn);
  });

  /* ---------- Placar ---------- */
  const placarEl = document.getElementById("placar");
  PLACAR.forEach(function(item){
    const div = document.createElement("div");
    div.className = "placar-item";
    div.innerHTML =
      '<div class="placar-cabecalho">' +
        '<span class="placar-nome">' + item.nome + '</span>' +
        '<span class="placar-pct">' + item.pct + '%</span>' +
      '</div>' +
      '<div class="placar-trilho"><div class="placar-preenchido" style="width:' + item.pct + '%"></div></div>' +
      '<p class="placar-fase">' + item.fase + '</p>';
    placarEl.appendChild(div);
  });

  /* ---------- Filtro de impacto (chips) ---------- */
  const filtroImpactoEl = document.getElementById("filtro-impacto");
  Object.keys(IMPACTO_ROTULO).forEach(function(chave){
    const chip = document.createElement("button");
    chip.className = "chip impacto-" + chave;
    chip.innerHTML = '<span class="ponto"></span>' + IMPACTO_ROTULO[chave];
    chip.setAttribute("aria-pressed","false");
    chip.addEventListener("click", function(){
      if (impactosAtivos.has(chave)){
        impactosAtivos.delete(chave);
        chip.setAttribute("aria-pressed","false");
      } else {
        impactosAtivos.add(chave);
        chip.setAttribute("aria-pressed","true");
      }
      renderFeed();
    });
    filtroImpactoEl.appendChild(chip);
  });

  /* ---------- Carregamento de dados desacoplado ---------- */
  async function carregarDados(){
    const indicador = document.getElementById("fonte-dados-indicador");
    try {
      const resposta = await fetch("noticias.json");
      if (!resposta.ok) throw new Error("noticias.json indisponível (" + resposta.status + ")");
      const dados = await resposta.json();
      if (!Array.isArray(dados) || dados.length === 0) throw new Error("noticias.json vazio");
      noticiasCarregadas = dados;
      indicador.textContent = "Fonte de dados: noticias.json";
    } catch (erro) {
      noticiasCarregadas = FALLBACK_NOTICIAS;
      indicador.textContent = "Fonte de dados: exemplo local (noticias.json não encontrado)";
    }
    renderFeed();
  }

  /* ---------- Feed ---------- */
  const feedEl = document.getElementById("feed");
  const contadorEl = document.getElementById("contador-resultados");

  function noticiaPertenceAba(n, aba){
    if (aba === "geral") return true;
    if (aba === "fertilizantes") return n.setor === "fertilizantes";
    if (aba === "agronegocio") return n.setor === "agronegocio";
    if (aba === "reforma") return n.esfera === "reforma";
    return true;
  }

  function renderFeed(){
    const filtradas = noticiasCarregadas.filter(function(n){
      if (!noticiaPertenceAba(n, filtroAbaAtiva)) return false;
      if (impactosAtivos.size > 0 && !impactosAtivos.has(n.impacto)) return false;
      return true;
    });

    contadorEl.textContent = filtradas.length + (filtradas.length === 1 ? " notícia encontrada" : " notícias encontradas");
    feedEl.innerHTML = "";

    if (filtradas.length === 0){
      const vazio = document.createElement("div");
      vazio.className = "vazio";
      vazio.textContent = "Nenhuma notícia para os filtros selecionados.";
      feedEl.appendChild(vazio);
      return;
    }

    filtradas.forEach(function(n){
      const card = document.createElement("article");
      card.className = "noticia";
      const rotuloEsfera = (ESFERA_ROTULO[n.esfera] || n.esfera).toUpperCase();
      const textoTagEsfera = n.uf ? (rotuloEsfera + " · " + n.uf) : rotuloEsfera;
      card.innerHTML =
        '<div class="noticia-topo">' +
          '<span class="badge impacto-' + n.impacto + '">' + IMPACTO_ROTULO[n.impacto] + '</span>' +
          '<span class="tag-esfera">' + textoTagEsfera + '</span>' +
          '<span class="noticia-fonte">' + n.fonte + '</span>' +
        '</div>' +
        '<h3 class="noticia-titulo">' + n.titulo + '</h3>' +
        '<p class="noticia-resumo">' + n.resumo + '</p>' +
        '<a class="noticia-link" href="' + n.link + '" target="_blank" rel="noopener">Abrir fonte completa</a>';
      feedEl.appendChild(card);
    });
  }

  carregarDados();

})();
</script>

</body>
</html>
